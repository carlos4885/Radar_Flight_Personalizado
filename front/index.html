<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈ Air Radar — MAD</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e14; color: #00e5ff; font-family: 'Share Tech Mono', monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    .hud-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; border-bottom: 1px solid #00e5ff22; flex-shrink: 0;
    }
    .hud-title { font-family: 'Orbitron', monospace; font-size: 14px; letter-spacing: 4px; color: #00e5ff; }
    .hud-meta { display: flex; gap: 24px; font-size: 11px; color: #00e5ff66; letter-spacing: 1px; }
    .hud-meta span { color: #f0c040; }
    #clockDisplay { font-size: 12px; color: #00e5ffaa; letter-spacing: 2px; }

    /* BODY */
    .hud-body { display: flex; flex: 1; overflow: hidden; }

    /* RADAR */
    .radar-panel { position: relative; flex: 1; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* SCAN LINE */
    .scan-line {
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #00e5ff55, transparent);
      animation: scandown 4s linear infinite; pointer-events: none; z-index: 5;
    }
    @keyframes scandown { 0% { top: 0; } 100% { top: 100%; } }

    /* SIDEBAR */
    .sidebar {
      width: 240px; border-left: 1px solid #00e5ff1a;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: 10px 14px; font-size: 10px; letter-spacing: 2px;
      color: #00e5ff44; border-bottom: 1px solid #00e5ff1a; flex-shrink: 0;
    }
    .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
    .sidebar-list::-webkit-scrollbar { width: 3px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: #00e5ff33; }

    /* PLANE CARD */
    .plane-card {
      background: #0d1520; border: 1px solid #00e5ff22; border-radius: 4px;
      padding: 9px 11px; margin-bottom: 6px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s; position: relative;
    }
    .plane-card:hover { border-color: #f0c04066; }
    .plane-card.active { border-color: #f0c040; background: #1a150a; }
    .plane-callsign { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; color: #f0c040; letter-spacing: 2px; }
    .plane-airline { font-size: 10px; color: #00e5ffaa; margin-top: 2px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plane-row { display: flex; justify-content: space-between; margin-top: 5px; }
    .plane-speed { font-size: 10px; color: #44ff88; }
    .plane-alt { font-size: 10px; color: #ffffff55; }
    .plane-dist { font-size: 10px; color: #00e5ff88; }
    .dot { position: absolute; top: 9px; right: 9px; width: 5px; height: 5px; border-radius: 50%; background: #44ff88; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.5); } }

    /* FOOTER */
    .hud-footer {
      display: flex; align-items: center; gap: 20px;
      padding: 8px 20px; border-top: 1px solid #00e5ff1a; font-size: 10px;
      color: #00e5ff44; letter-spacing: 1px; flex-shrink: 0;
    }
    .hud-footer span { color: #f0c040; }
    #statusMsg { color: #ff444499; }
    .btn {
      margin-left: auto; font-family: 'Share Tech Mono', monospace; font-size: 10px;
      background: transparent; border: 1px solid #00e5ff33; color: #00e5ffaa;
      padding: 4px 14px; border-radius: 2px; cursor: pointer; letter-spacing: 1px; transition: all 0.15s;
    }
    .btn:hover { border-color: #00e5ff; color: #00e5ff; }
    .blink { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* TOOLTIP en mapa */
    #tooltip {
      position: absolute; background: #0d1520ee; border: 1px solid #f0c04066;
      border-radius: 4px; padding: 8px 12px; font-size: 11px; pointer-events: none;
      display: none; z-index: 20; min-width: 160px;
    }
    #tooltip .t-cs { font-family: 'Orbitron', monospace; font-size: 13px; color: #f0c040; font-weight: 700; }
    #tooltip .t-al { color: #00e5ffaa; font-size: 10px; margin-top: 2px; }
    #tooltip .t-sp { color: #44ff88; font-size: 10px; margin-top: 4px; }
    #tooltip .t-alt { color: #ffffff66; font-size: 10px; }

    /* MODAL PARA CONFIGURACIÓN */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }
    .modal-content {
      background: #0d1520;
      border: 1px solid #f0c040;
      border-radius: 8px;
      margin: 15% auto;
      padding: 20px;
      width: 300px;
      font-family: 'Share Tech Mono', monospace;
    }
    .modal-content input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      background: #1a1f2a;
      border: 1px solid #00e5ff44;
      color: #00e5ff;
      font-family: 'Share Tech Mono', monospace;
    }
    .modal-content button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #f0c040;
      border: none;
      color: #0a0e14;
      cursor: pointer;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
    }
    .modal-content button:hover {
      background: #ffd966;
    }
    .editable {
      cursor: pointer;
      transition: all 0.2s;
    }
    .editable:hover {
      color: #f0c040;
    }
  </style>
</head>
<body>

  <div class="hud-header">
    <div class="hud-title">✈ AIR RADAR — PEDRO ✈</div>
    <div class="hud-meta">
      RADIO: <span id="cfgRadio">—</span> km &nbsp;|&nbsp;
      MÍN: <span id="cfgMin">—</span> kt &nbsp;|&nbsp;
      <span class="blink">◉</span>&nbsp;LIVE
    </div>
    <div id="clockDisplay">--:--:-- UTC</div>
  </div>

  <div class="hud-body">
    <div class="radar-panel" id="radarPanel">
      <div class="scan-line"></div>
      <canvas id="radarCanvas"></canvas>
      <div id="tooltip">
        <div class="t-cs" id="tt-cs"></div>
        <div class="t-al" id="tt-al"></div>
        <div class="t-sp" id="tt-sp"></div>
        <div class="t-alt" id="tt-alt"></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">CONTACTOS ACTIVOS &nbsp;<span id="countDisplay" style="color:#f0c040">—</span></div>
      <div class="sidebar-list" id="planeList"></div>
    </div>
  </div>

  <div class="hud-footer">
    ORIGEN: <span>40.47°N 3.59°W</span> &nbsp;|&nbsp;
    URL CENTRAL: <span id="backendUrlDisplay">Cargando...</span> &nbsp;|&nbsp;
    ESTADO: <span id="statusMsg">CONECTANDO...</span>
    <button class="btn" onclick="fetchData()">↺ REFRESH</button>
  </div>

  <div id="configModal" class="modal">
    <div class="modal-content">
      <h3 style="color:#f0c040; margin-bottom:15px;">✈ CONFIGURAR RADAR</h3>
      <label for="modalRadio" style="display:block;">RADIO (km):</label>
      <input type="number" id="modalRadio" min="1" max="200" step="5" style="display:block;">
      <label for="modalVelocidad" style="display:block; margin-top:10px;">VELOCIDAD MÍNIMA (nudos):</label>
      <input type="number" id="modalVelocidad" min="0" max="600" step="10" style="display:block;">
      <button onclick="guardarConfiguracion()">GUARDAR</button>
      <button onclick="cerrarModal()" style="background:#444; margin-left:10px;">CANCELAR</button>
    </div>
  </div>

  <script>
    // ============ BASE URL CONFIG ============
    // ⚠️ IMPORTANTE: Reemplaza esto con tu URL real de Render cuando la crees
    const BASE_URL = 'https://radar-flight-personalizado-1.onrender.com'; 
    const BACKEND_URL = `${BASE_URL}/aviones`;

    // Mostrar URL en el footer de forma elegante
    document.getElementById('backendUrlDisplay').textContent = BASE_URL.replace('https://', '');

    // ============ STATE ============
    let planes = [], trails = {}, selectedId = null, sweepAngle = 0;
    let HOME_LAT = 40.466555, HOME_LON = -3.593562, RADIO_KM = 30;
    let variableEditando = null;

    // ============ CANVAS ============
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const panel = document.getElementById('radarPanel');
      canvas.width = panel.clientWidth;
      canvas.height = panel.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ============ COORDS ============
    function latLonToXY(lat, lon) {
      const W = canvas.width, H = canvas.height;
      const R = Math.min(W, H) * 0.44;
      const scale = R / RADIO_KM;
      const degLon = 1 / (111.0 * Math.cos(HOME_LAT * Math.PI / 180));
      const dx = (lon - HOME_LON) / degLon;
      const dy = -(lat - HOME_LAT) * 111.0;
      return { x: W / 2 + dx * scale, y: H / 2 + dy * scale };
    }

    // ============ DRAW ============
    function draw() {
      const W = canvas.width, H = canvas.height;
      const cx = W / 2, cy = H / 2;
      const R = Math.min(W, H) * 0.44;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0a0e14';
      ctx.fillRect(0, 0, W, H);

      // Rings
      [1, 0.75, 0.5, 0.25].forEach((f, i) => {
        ctx.beginPath(); ctx.arc(cx, cy, R * f, 0, Math.PI * 2);
        ctx.strokeStyle = i === 0 ? '#00e5ff44' : '#00e5ff1a';
        ctx.lineWidth = i === 0 ? 1 : 0.5;
        ctx.stroke();
      });

      // Crosshairs
      ctx.strokeStyle = '#00e5ff1a'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
      
      // Diagonals
      [45, 135].forEach(a => {
        const rad = a * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(cx - Math.cos(rad) * R, cy - Math.sin(rad) * R);
        ctx.lineTo(cx + Math.cos(rad) * R, cy + Math.sin(rad) * R);
        ctx.stroke();
      });

      // Ring labels
      ctx.fillStyle = '#00e5ff33'; ctx.font = '9px Share Tech Mono'; ctx.textAlign = 'left';
      [[`${RADIO_KM}km`, 1], [`${Math.round(RADIO_KM*0.75)}km`, 0.75], [`${Math.round(RADIO_KM*0.5)}km`, 0.5], [`${Math.round(RADIO_KM*0.25)}km`, 0.25]].forEach(([l, f]) => {
        ctx.fillText(l, cx + R * f + 3, cy - 3);
      });

      // Compass
      ctx.fillStyle = '#00e5ff55'; ctx.font = '11px Share Tech Mono';
      ctx.textAlign = 'center'; ctx.fillText('N', cx, cy - R - 10);
      ctx.fillText('S', cx, cy + R + 16);
      ctx.textAlign = 'right'; ctx.fillText('O', cx - R - 8, cy + 4);
      ctx.textAlign = 'left'; ctx.fillText('E', cx + R + 8, cy + 4);

      // Sweep
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(sweepAngle);
      const sweep = ctx.createLinearGradient(0, -R, 0, 0);
      sweep.addColorStop(0, '#00e5ff00');
      sweep.addColorStop(1, '#00e5ff15');
      ctx.fillStyle = sweep;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, -Math.PI / 2 - Math.PI / 10, -Math.PI / 2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#00e5ff55'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -R); ctx.stroke();
      ctx.restore();

      // Trails
      planes.forEach(p => {
        const t = trails[p.icao24];
        if (!t || t.length < 2) return;
        const isSel = p.callsign === selectedId;
        ctx.beginPath();
        const s = latLonToXY(t[0].lat, t[0].lon);
        ctx.moveTo(s.x, s.y);
        for (let i = 1; i < t.length; i++) {
          const pt = latLonToXY(t[i].lat, t[i].lon);
          ctx.lineTo(pt.x, pt.y);
        }
        ctx.strokeStyle = isSel ? '#f0c04099' : '#f0c04033';
        ctx.lineWidth = isSel ? 2 : 1;
        ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
      });

      // Home
      ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ff444422'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ff4444'; ctx.fill();
      ctx.fillStyle = '#ff444477'; ctx.font = '9px Share Tech Mono'; ctx.textAlign = 'left';
      ctx.fillText('HOME', cx + 8, cy + 4);

      // Planes
      planes.forEach(p => {
        if (!p.latitud || !p.longitud) return;
        const pos = latLonToXY(p.latitud, p.longitud);
        const isSel = p.callsign === selectedId;
        const hdg = ((p.heading || 0) - 90) * Math.PI / 180;

        ctx.save(); ctx.translate(pos.x, pos.y); ctx.rotate(hdg + Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, -9); ctx.lineTo(-5, 6); ctx.lineTo(0, 3); ctx.lineTo(5, 6); ctx.closePath();
        ctx.fillStyle = isSel ? '#ffe066' : '#f0c040';
        ctx.fill();
        if (isSel) { ctx.strokeStyle = '#ffe066cc'; ctx.lineWidth = 1.5; ctx.stroke(); }
        ctx.restore();

        if (isSel) {
          ctx.beginPath(); ctx.arc(pos.x, pos.y, 15, 0, Math.PI * 2);
          ctx.strokeStyle = '#f0c04044'; ctx.lineWidth = 1; ctx.stroke();
        }

        // Labels
        const lx = pos.x + 13, ly = pos.y;
        ctx.fillStyle = isSel ? '#ffe066' : '#f0c040cc';
        ctx.font = isSel ? '700 11px Orbitron, monospace' : '10px Orbitron, monospace';
        ctx.textAlign = 'left';
        ctx.fillText(p.callsign || '?', lx, ly - 5);
        ctx.fillStyle = '#00e5ffaa'; ctx.font = '9px Share Tech Mono';
        ctx.fillText(p.velocidad_kmh + ' km/h', lx, ly + 6);
        ctx.fillStyle = '#ffffff44'; ctx.font = '9px Share Tech Mono';
        ctx.fillText(p.altitud_m + ' m', lx, ly + 16);
      });

      sweepAngle += 0.025;
    }

    // ============ SIDEBAR ============
    function updateSidebar() {
      const list = document.getElementById('planeList');
      if (!planes.length) {
        list.innerHTML = '<div style="font-size:10px;color:#00e5ff33;padding:12px 0;text-align:center">Sin contactos activos</div>';
        return;
      }
      list.innerHTML = '';
      [...planes].sort((a, b) => a.distancia_km - b.distancia_km).forEach(p => {
        const card = document.createElement('div');
        card.className = 'plane-card' + (p.callsign === selectedId ? ' active' : '');
        card.innerHTML = `
          <div class="dot"></div>
          <div class="plane-callsign">${p.callsign}</div>
          <div class="plane-airline">${p.aerolinea}</div>
          <div class="plane-row">
            <span class="plane-speed">⚡ ${p.velocidad_kmh} km/h</span>
            <span class="plane-dist">${p.distancia_km} km</span>
          </div>
          <div class="plane-row">
            <span class="plane-alt">↑ ${p.altitud_m} m</span>
            <span class="plane-alt">${p.velocidad_knots} kt</span>
          </div>`;
        card.addEventListener('click', () => {
          selectedId = selectedId === p.callsign ? null : p.callsign;
          updateSidebar();
        });
        list.appendChild(card);
      });
    }

    // ============ TOOLTIP ============
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);
      const tip = document.getElementById('tooltip');
      let found = null;
      planes.forEach(p => {
        if (!p.latitud) return;
        const pos = latLonToXY(p.latitud, p.longitud);
        if (Math.hypot(mx - pos.x, my - pos.y) < 16) found = p;
      });
      if (found) {
        document.getElementById('tt-cs').textContent = found.callsign;
        document.getElementById('tt-al').textContent = found.aerolinea;
        document.getElementById('tt-sp').textContent = `⚡ ${found.velocidad_kmh} km/h  /  ${found.velocidad_knots} kt`;
        document.getElementById('tt-alt').textContent = `↑ ${found.altitud_m} m  ·  ${found.distancia_km} km`;
        tip.style.display = 'block';
        tip.style.left = (e.clientX - rect.left + 16) + 'px';
        tip.style.top = (e.clientY - rect.top - 10) + 'px';
      } else {
        tip.style.display = 'none';
      }
    });
    canvas.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.display = 'none'; });
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);
      let found = null;
      planes.forEach(p => {
        if (!p.latitud) return;
        const pos = latLonToXY(p.latitud, p.longitud);
        if (Math.hypot(mx - pos.x, my - pos.y) < 16) found = p;
      });
      if (found) { selectedId = selectedId === found.callsign ? null : found.callsign; updateSidebar(); }
    });

    // ============ CLOCK ============
    function updateClock() {
      const n = new Date();
      document.getElementById('clockDisplay').textContent =
        [n.getUTCHours(), n.getUTCMinutes(), n.getUTCSeconds()]
          .map(v => String(v).padStart(2, '0')).join(':') + ' UTC';
    }

    // ============ CONFIGURACIÓN MODIFICABLE ============
    async function cargarConfiguracion() {
      try {
        const resp = await fetch(`${BASE_URL}/config`);
        const config = await resp.json();
        document.getElementById('cfgRadio').textContent = config.radio_km;
        document.getElementById('cfgMin').textContent = config.velocidad_minima_knots;
        RADIO_KM = config.radio_km;
      } catch (err) {
        console.error('Error cargando config:', err);
      }
    }

    function abrirModal(tipo) {
      variableEditando = tipo;
      const modal = document.getElementById('configModal');
      const radioInput = document.getElementById('modalRadio');
      const velocidadInput = document.getElementById('modalVelocidad');
      const modalTitle = document.querySelector('.modal-content h3');
      const radioLabel = document.querySelector('.modal-content label:first-of-type');
      const velocidadLabel = document.querySelector('.modal-content label:last-of-type');
      
      if (tipo === 'radio') {
        radioInput.value = document.getElementById('cfgRadio').textContent;
        radioInput.style.display = 'block';
        radioLabel.style.display = 'block';
        velocidadInput.style.display = 'none';
        velocidadLabel.style.display = 'none';
        modalTitle.textContent = '✈ CONFIGURAR RADIO (km)';
      } else {
        velocidadInput.value = document.getElementById('cfgMin').textContent;
        radioInput.style.display = 'none';
        radioLabel.style.display = 'none';
        velocidadInput.style.display = 'block';
        velocidadLabel.style.display = 'block';
        modalTitle.textContent = '✈ CONFIGURAR VELOCIDAD MÍNIMA (nudos)';
      }
      modal.style.display = 'block';
    }

    function cerrarModal() {
      document.getElementById('configModal').style.display = 'none';
      variableEditando = null;
    }

    async function guardarConfiguracion() {
      const url = variableEditando === 'radio' 
        ? `${BASE_URL}/config/radio`
        : `${BASE_URL}/config/velocidad`;
      
      const valor = variableEditando === 'radio'
        ? document.getElementById('modalRadio').value
        : document.getElementById('modalVelocidad').value;
      
      const body = variableEditando === 'radio'
        ? { radio_km: parseInt(valor) }
        : { velocidad_minima_knots: parseInt(valor) };
      
      try {
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        
        if (resp.ok) {
          if (variableEditando === 'radio') {
            document.getElementById('cfgRadio').textContent = data.radio_km;
            RADIO_KM = data.radio_km;
          } else {
            document.getElementById('cfgMin').textContent = data.velocidad_minima_knots;
          }
          await fetchData();
          cerrarModal();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Error al guardar: ' + err.message);
      }
    }

    function hacerEditables() {
      const radioSpan = document.getElementById('cfgRadio');
      const minSpan = document.getElementById('cfgMin');
      
      radioSpan.classList.add('editable');
      minSpan.classList.add('editable');
      
      radioSpan.onclick = () => abrirModal('radio');
      minSpan.onclick = () => abrirModal('velocidad');
    }

    // ============ FETCH ============
    async function fetchData() {
      if (document.getElementById('cfgRadio').textContent === '—') {
        await cargarConfiguracion();
      }
      
      document.getElementById('statusMsg').textContent = 'ACTUALIZANDO...';
      document.getElementById('statusMsg').style.color = '#00e5ff88';
      try {
        const resp = await fetch(BACKEND_URL);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        if (data.config) {
          document.getElementById('cfgRadio').textContent = data.config.radio_km;
          document.getElementById('cfgMin').textContent = data.config.velocidad_minima_knots;
          HOME_LAT = data.config.lat;
          HOME_LON = data.config.lon;
          RADIO_KM = data.config.radio_km;
        }

        (data.aviones || []).forEach(p => {
          if (!trails[p.icao24]) trails[p.icao24] = [];
          trails[p.icao24].push({ lat: p.latitud, lon: p.longitud });
          if (trails[p.icao24].length > 25) trails[p.icao24].shift();
        });

        planes = data.aviones || [];
        document.getElementById('countDisplay').textContent = planes.length;
        document.getElementById('statusMsg').textContent = 'OK';
        document.getElementById('statusMsg').style.color = '#44ff88';
        updateSidebar();
      } catch (err) {
        document.getElementById('statusMsg').textContent = 'ERROR: ' + err.message;
        document.getElementById('statusMsg').style.color = '#ff4444aa';
        console.error(err);
      }
    }

    // ============ LOOP ============
    function loop() { draw(); updateClock(); requestAnimationFrame(loop); }
    loop();
    
    // Inicializar
    window.addEventListener('DOMContentLoaded', () => {
      hacerEditables();
      cargarConfiguracion();
      fetchData();
    });
    
    setInterval(fetchData, 10000);

    window.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('bdOverlay');
      const bar = document.getElementById('bdBar');
      if (overlay && bar) {
        requestAnimationFrame(() => { bar.style.width = '0%'; });
        setTimeout(() => { overlay.style.display = 'none'; }, 5000);
      }
    });
  </script>

  <div id="bdOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Share Tech Mono',monospace;">
    <div style="border:1px solid #f0c040;background:#0a0e14;padding:60px 80px;text-align:center;max-width:92vw;width:92vw;height:90vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      
      <div style="position:absolute;top:-1px;left:-1px;width:24px;height:24px;border-top:2px solid #f0c040;border-left:2px solid #f0c040;"></div>
      <div style="position:absolute;top:-1px;right:-1px;width:24px;height:24px;border-top:2px solid #f0c040;border-right:2px solid #f0c040;"></div>
      <div style="position:absolute;bottom:-1px;left:-1px;width:24px;height:24px;border-bottom:2px solid #f0c040;border-left:2px solid #f0c040;"></div>
      <div style="position:absolute;bottom:-1px;right:-1px;width:24px;height:24px;border-bottom:2px solid #f0c040;border-right:2px solid #f0c040;"></div>

      <div style="font-size:12px;letter-spacing:6px;color:#00e5ff66;margin-bottom:40px;">
        <span class="blink">◉</span>&nbsp; MENSAJE ENTRANTE &nbsp;<span class="blink">◉</span>
      </div>
      <div style="font-size:80px;margin-bottom:24px;animation:bdfly 3s ease-in-out infinite;">✈</div>
      <div style="font-family:'Orbitron',monospace;font-size:52px;font-weight:700;color:#f0c040;letter-spacing:6px;margin-bottom:16px;line-height:1.1;">FELIZ CUMPLEAÑOS</div>
      <div style="font-family:'Orbitron',monospace;font-size:36px;color:#00e5ffcc;letter-spacing:8px;margin-bottom:12px;">PEDRO</div>
      <div style="font-size:13px;color:#ffffff44;letter-spacing:3px;margin-top:48px;padding-top:28px;border-top:1px solid #00e5ff1a;width:100%;">
        CON CARIÑO DE &nbsp;<span style="color:#f0c040cc;font-size:30px;">CARLOS &amp; CLARA</span>
      </div>
      <div id="bdProgress" style="margin-top:32px;height:2px;background:#00e5ff1a;width:100%;position:relative;overflow:hidden;">
        <div id="bdBar" style="height:100%;background:#f0c040;width:100%;transition:width 5s linear;"></div>
      </div>
      <div style="font-size:10px;color:#00e5ff33;letter-spacing:2px;margin-top:10px;">CERRANDO AUTOMÁTICAMENTE...</div>
    </div>
  </div>

  <style>
    @keyframes bdfly {
      0%,100% { transform: translateX(-8px) rotate(-4deg); }
      50%      { transform: translateX(8px) rotate(4deg); }
    }
  </style>
</body>
</html>
